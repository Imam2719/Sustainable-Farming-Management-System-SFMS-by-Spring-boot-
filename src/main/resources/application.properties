# ===============================
# APPLICATION INFORMATION
# ===============================
spring.application.name=SFMS - Sustainable Farming Management System
server.port=8080

# ===============================
# DATABASE CONFIGURATION (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/sfms
spring.datasource.username=postgres
spring.datasource.password=Imam9755
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# THYMELEAF CONFIGURATION
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ===============================
# FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# File Storage Location
file.upload-dir=uploads

# ===============================
# OAUTH2 GOOGLE CONFIGURATION
# ===============================
# Replace with your Google OAuth2 credentials from Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=125864292134-mjicl73do4o7pnlug5ob6eeots6hdr2d.apps.googleusercontent.com
